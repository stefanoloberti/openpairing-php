name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        arithmetic: [limbs, gmp]
    name: PHP ${{ matrix.php }} / ${{ matrix.arithmetic }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.arithmetic == 'gmp' && 'mbstring, gmp' || 'mbstring' }}
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lock arithmetic backend
        shell: bash
        run: |
          if [[ "${{ matrix.arithmetic }}" == gmp ]]; then
            echo 'OPENPAIRING_ARITHMETIC_BACKEND=gmp' >> "$GITHUB_ENV"
          else
            echo 'OPENPAIRING_ARITHMETIC_BACKEND=limbs-30' >> "$GITHUB_ENV"
          fi

      - name: Rapid correctness gate
        run: composer check

      - name: Runtime package smoke
        run: |
          php bin/openpairing.php --version
          php bin/openpairing.php examples/pairing-round-1.json

  release-source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify distribution provenance files
        run: |
          test -s LICENSE
          test -s NOTICE
          test -s docs/LICENSE-PROVENANCE.md
          test -s docs/PORTING-MAP.md
          ! git ls-files | grep -q '^tools/upstream/'
          grep -F 'Copyright (c) 2024 FIDE' NOTICE
          grep -F 'Copyright 2016-2026 Jeremy Bierema' NOTICE
